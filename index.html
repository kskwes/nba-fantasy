<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <!-- theme-color は付けない（/nba 配下のページと同じく、ステータスバーの色はiOSにヘッダーから決めさせる） -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="NBA Fantasy">
    <!-- 修正をアップするたびに、この番号と下の style.css / app.js の ?v= を同じ値に上げる -->
    <meta name="app-version" content="2.2">
    <title>NBA Fantasy</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="icon-180.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&display=swap">
    <link rel="stylesheet" href="style.css?v=2.2">
</head>
<body>
    <header>
        <div class="header-inner">
            <div>
                <h1>NBA <em>Fantasy</em></h1>
                <div class="header-sub" id="header-sub">読み込み中…</div>
            </div>
            <button class="refresh-btn" id="refresh-btn" aria-label="更新">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
            </button>
        </div>
    </header>

    <main>
        <section class="view active" id="view-week"><div class="msg">読み込み中…</div></section>
        <section class="view" id="view-team"></section>
        <section class="view" id="view-history"></section>
        <section class="view" id="view-settings"></section>
    </main>

    <!-- タブバーと同じく固定配置にしない（iOSのホーム画面アプリでタップが効かなくなるため） -->
    <div class="update-bar" id="update-bar" hidden>
        <span id="update-text">新しいバージョンがあります</span>
        <button class="btn primary" id="update-btn">更新</button>
    </div>

    <nav class="tabbar">
        <button class="tab active" data-view="week">今週</button>
        <button class="tab" data-view="team">編成</button>
        <button class="tab" data-view="history">履歴</button>
        <button class="tab" data-view="settings">設定</button>
    </nav>

    <div class="modal" id="modal" hidden>
        <div class="modal-backdrop" data-close></div>
        <div class="sheet" role="dialog" aria-modal="true">
            <button class="sheet-close" data-close aria-label="閉じる">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
            </button>
            <div id="modal-body"></div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script src="app.js?v=2.2"></script>
</body>
</html>
