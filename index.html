<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0A0B0F">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="NBA Fantasy">
    <!-- 修正をアップするたびに、この番号と下の style.css / app.js の ?v= を同じ値に上げる -->
    <meta name="app-version" content="1.4">
    <title>NBA Fantasy</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="icon-180.png">
    <link rel="stylesheet" href="style.css?v=1.4">
</head>
<body>
    <header>
        <div class="header-inner">
            <div>
                <h1>NBA <em>Fantasy</em></h1>
                <div class="header-sub" id="header-sub">読み込み中…</div>
            </div>
            <button class="refresh-btn" id="refresh-btn" aria-label="更新">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
            </button>
        </div>
    </header>

    <main>
        <section class="view active" id="view-week"><div class="msg">読み込み中…</div></section>
        <section class="view" id="view-team"></section>
        <section class="view" id="view-history"></section>
        <section class="view" id="view-settings"></section>
    </main>

    <nav class="tabbar">
        <button class="tab active" data-view="week">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3v18M5.6 5.6c3 3 3 9.8 0 12.8M18.4 5.6c-3 3-3 9.8 0 12.8"/></svg>
            今週
        </button>
        <button class="tab" data-view="team">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5"/><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8M18.5 14.8c1.6.8 2.6 2.6 3 5.2"/></svg>
            編成
        </button>
        <button class="tab" data-view="history">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
            履歴
        </button>
        <button class="tab" data-view="settings">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>
            設定
        </button>
    </nav>

    <div class="modal" id="modal" hidden>
        <div class="modal-backdrop" data-close></div>
        <div class="sheet" role="dialog" aria-modal="true">
            <button class="sheet-close" data-close aria-label="閉じる">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
            </button>
            <div id="modal-body"></div>
        </div>
    </div>

    <div class="update-bar" id="update-bar" hidden>
        <span id="update-text">新しいバージョンがあります</span>
        <button class="btn primary" id="update-btn">更新</button>
    </div>

    <div class="toast" id="toast"></div>

    <script src="app.js?v=1.4"></script>
</body>
</html>
